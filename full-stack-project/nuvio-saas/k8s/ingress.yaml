apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nuvio-ingress
  namespace: nuvio
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: nuvio.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nuvio-service
                port:
                  number: 80
