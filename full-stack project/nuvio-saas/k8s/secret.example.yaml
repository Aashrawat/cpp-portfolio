# Copy to secret.yaml, fill in values, then: kubectl apply -f k8s/secret.yaml
# Do NOT commit secret.yaml with real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: nuvio-secrets
  namespace: nuvio
type: Opaque
stringData:
  MONGODB_URI: "mongodb://user:password@host:27017/web322db?ssl=true&authSource=admin"
  JWT_SECRET: "replace-with-a-long-random-secret"
